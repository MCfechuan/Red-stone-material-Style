        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            background-color: rgba(25, 25, 45, 0.8);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 50, 50, 0.3);
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';

            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff2e2e, #ff8a00);

        header {

        .subtitle {

            color: #aaa;

            box-shadow: 0 5px 15px rgba(255, 50, 50, 0.4);
            margin-bottom: 10px;
        }
        
        .intro-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 50, 50, 0.6);
            background: linear-gradient(135deg, #ff4444, #ff7700);
        }
        
        .intro-btn:active {
            transform: translateY(1px);
        }
        
        .content-area {
            margin-top: 30px;
            padding: 25px;
            background-color: rgba(30, 30, 50, 0.6);
            border-radius: 15px;
            border-left: 5px solid #ff3333;
            display: none;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .intro-text {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #ffcc00;
            margin-bottom: 25px;
            text-align: center;
            padding: 15px;
            background-color: rgba(255, 50, 50, 0.1);
            border-radius: 10px;
        }
        
        .download-btn {
            display: block;
            width: 250px;
            margin: 0 auto;
            background: linear-gradient(135deg, #00cc66, #00994d);
            color: white;
            text-decoration: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 200, 100, 0.4);
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 200, 100, 0.6);
            background: linear-gradient(135deg, #00dd77, #00aa55);
        }
        
        .download-btn:active {
            transform: translateY(1px);
        }
        
        .download-info {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #88aaff;
        }
        
        .material-preview {
            display: flex;
            justify-content: center;
            margin-top: 40px;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .preview-item {
            width: 180px;
            height: 180px;
            background: linear-gradient(45deg, #220000, #440000);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6666;
            font-size: 1.1rem;
            border: 2px solid rgba(255, 50, 50, 0.4);
            transition: transform 0.3s ease;
        }
        
        .preview-item:hover {
            transform: scale(1.05);
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            width: 100%;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .container {
                padding: 20px;
            }
            
            .intro-text {

            }
            
            .preview-item {

            }
        }
    </style>
</head>
